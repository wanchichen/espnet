##########################################################
#                   Inference SETTING                    #
##########################################################
# Decodes VoxPopuli's own dev and test splits for one language.
#
#   python run.py --stages infer \
#       --training_config conf/tuning/train_asr_e_branchformer.yaml \
#       --inference_config conf/inference.yaml
#   python run.py --stages measure \
#       --training_config conf/tuning/train_asr_e_branchformer.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# The only base is egs3/TEMPLATE/asr/conf/inference.yaml, which run.py injects
# automatically via load_and_merge_config(default_package="egs3.TEMPLATE.asr").
#
# exp_tag / exp_dir / inference_dir are omitted on purpose: run.py copies
# exp_tag and exp_dir from the training config, and inference_dir then defaults
# to ${exp_dir}/<stem of this file>, i.e. exp/<lang>/<tag>/inference/.

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .

# Keep these in step with the training config: `lang` selects which language's
# dev/test sets are decoded, and the model under ${exp_dir} was trained on that
# language's tokenizer. `dataset_dir` is left unset so the corpus resolves the
# same way it does during training (dataset/config.yaml documents the order).
lang: en
dataset_dir:
text_field: normalized_text

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `name` becomes the subdirectory under ${inference_dir} that `measure` scores.
# `data_src` is omitted, so ESPnet3 loads ${recipe_dir}/dataset/__init__.py and
# passes `data_src_args` straight to VoxPopuliDataset(...).
#
# For `lang: en_accented` (a 29 h test-only accented-English set) delete the
# `dev` entry -- that language has no dev split and the dataset raises.
dataset:
  test:
    - name: dev
      data_src_args:
        split: dev
        lang: ${lang}
        recipe_dir: ${recipe_dir}
        source_dir: ${dataset_dir}
        text_field: ${text_field}
    - name: test
      data_src_args:
        split: test
        lang: ${lang}
        recipe_dir: ${recipe_dir}
        source_dir: ${dataset_dir}
        text_field: ${text_field}

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# No language model: ESPnet3 has no LM stage, so nothing under exp/ is an LM and
# lm_weight would be ignored by Speech2Text.
#
# asr_train_config is espnet3's exp/<lang>/<tag>/config.yaml, written in espnet2
# ASRTask layout and readable by Speech2Text as-is. Its internal paths
# (token_list, bpemodel, normalize stats_file) are recipe-relative and run.py
# executes from the recipe directory, so they resolve.
model:
  _target_: espnet2.bin.asr_inference.Speech2Text
  asr_train_config: ${exp_dir}/config.yaml
  # Weight average over the top-10 valid/acc checkpoints, written by
  # AverageCheckpointsCallback (best_model_criterion keeps 10). If training
  # stopped before 10 epochs were validated, only ave_1best..ave_Nbest exist --
  # point this at one of those instead.
  asr_model_file: ${exp_dir}/valid.acc.ave_10best.pth
  beam_size: 20
  ctc_weight: 0.3
  penalty: 0.0
  maxlenratio: 0.0
  minlenratio: 0.0

input_key: speech
output_fn: src.inference.build_output

##########################################################
#                  PARALLELIZATION SETTING               #
##########################################################
# `env: local` yields exactly one shard regardless of n_workers, so inference
# runs single-process here. Shards are also the unit of resume, so for a large
# test set prefer a cluster backend: set `env: slurm` and supply your
# scheduler's options.
parallel:
  env: local
  n_workers: 1
