##########################################################
#                    TRAINING SETTING                    #
##########################################################
# VoxPopuli ASR, one language at a time.
#
# There is no egs2 VoxPopuli ASR recipe to port, so the model, optimizer and
# batching follow egs3/librispeech_100/asr (E-Branchformer 12L + Transformer
# decoder, hybrid CTC/attention), with epochs and vocabulary sized for this
# corpus. Every deviation from that reference is commented below.
#
# Self-contained: no `defaults:` block. The only base is
# egs3/TEMPLATE/asr/conf/training.yaml, which run.py injects automatically via
# load_and_merge_config(default_package="egs3.TEMPLATE.asr").
#
# Quick usage:
#   python run.py --stages create_dataset  --training_config conf/tuning/train_asr_e_branchformer.yaml
#   python run.py --stages train_tokenizer --training_config conf/tuning/train_asr_e_branchformer.yaml
#   python run.py --stages collect_stats   --training_config conf/tuning/train_asr_e_branchformer.yaml
#   python run.py --stages train           --training_config conf/tuning/train_asr_e_branchformer.yaml

task: espnet3.systems.asr.task.ASRTask

##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
recipe_dir: .
data_dir: ${recipe_dir}/data/${lang}
stats_dir: ${recipe_dir}/exp/stats/${lang}

# exp_tag follows TEMPLATE's ${self_name:} (the stem of this file); the language
# is appended so runs for two languages do not share one exp directory.
exp_dir: ${recipe_dir}/exp/${lang}/${exp_tag}

# VoxPopuli language. One of: en de fr es pl it ro hu cs nl fi hr sk sl et lt.
# (`en_accented` is a test set only and cannot be trained on.)
# Sizes range from 543 h (en) to 2 h (lt) -- see readme.md; for the small
# languages lower `tokenizer.vocab_size` and raise `trainer.max_epochs`.
lang: en

# Path to the VoxPopuli corpus. Accepted at any of three depths: the ROOT you
# passed to `voxpopuli.get_asr_data`, its `transcribed_data` directory, or the
# `transcribed_data/<lang>` directory itself.
#
# Left unset so it resolves the way dataset/config.yaml documents:
# <recipe_dir>/download/voxpopuli first, then the $VOXPOPULI environment
# variable. This recipe never downloads the corpus.
dataset_dir:

num_device: 1
num_nodes: 1

##########################################################
#                 DATASET CREATION SETTING               #
##########################################################
# VoxPopuli is prepared by the upstream scripts, so `create_dataset` only
# validates that the manifests and the segmented audio are on disk. These keys
# are forwarded to VoxPopuliBuilder (espnet3 BaseSystem.create_dataset passes
# this block through as builder kwargs).
create_dataset:
  recipe_dir: ${recipe_dir}
  lang: ${lang}
  source_dir: ${dataset_dir}

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# VoxPopuli's own train/dev/test split, taken from the `split` column of the
# upstream manifests. For English: 182,466 / 1,753 / 1,842 usable segments.
# `data_src` is omitted, so ESPnet3 loads ${recipe_dir}/dataset/__init__.py and
# passes `data_src_args` straight to VoxPopuliDataset(...).
dataset:
  train:
    - data_src_args:
        split: train
        lang: ${lang}
        recipe_dir: ${recipe_dir}
        source_dir: ${dataset_dir}
        text_field: ${text_field}
  valid:
    - data_src_args:
        split: dev
        lang: ${lang}
        recipe_dir: ${recipe_dir}
        source_dir: ${dataset_dir}
        text_field: ${text_field}

  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    # No `train:` key here: DataOrganizer sets it per split (True for train,
    # False for valid/test) and warns that a config value would be ignored.
    fs: 16000
    token_type: bpe
    token_list: ${tokenizer.save_path}/tokens.txt
    bpemodel: ${tokenizer.save_path}/${tokenizer.model_type}.model
    text_cleaner:
    # Speed perturbation at 0.9/1.1, as in egs3/librispeech_100. VoxPopuli
    # segments average about 10 s, so this is the main augmentation alongside
    # specaug below.
    data_aug_prob: 0.667
    data_aug_effects:
      - [0.5, "speed_perturb", {"factor": 0.9}]
      - [0.5, "speed_perturb", {"factor": 1.1}]

# Manifest column used as the ASR target. `normalized_text` is VoxPopuli's own
# ASR target (lowercased, punctuation stripped, numbers spelled out) and is what
# the published VoxPopuli ASR numbers are computed on. Switch to `raw_text` to
# train a cased-and-punctuated model; nothing else in this config changes, but
# the WER is then not comparable to the paper.
text_field: normalized_text

##########################################################
#                   TOKENIZER SETTING                    #
##########################################################
# BPE-5000 over the training transcripts of the selected language, matching
# egs3/librispeech_100. The tokenizer reads the manifest only -- no audio -- so
# this stage is fast even for English.
#
# For the small languages (et 3 h, lt 2 h, sl 10 h) 5000 merges exceed what the
# text supports and SentencePiece will refuse to train; drop vocab_size to
# ~500-1000 there, or switch model_type to `char`.
tokenizer:
  vocab_size: 5000
  character_coverage: 1.0
  model_type: bpe
  save_path: ${data_dir}/${tokenizer.model_type}_${tokenizer.vocab_size}
  text_builder:
    func: egs3.voxpopuli.asr.dataset.gather_training_text
    recipe_dir: ${recipe_dir}
    lang: ${lang}
    source_dir: ${dataset_dir}
    split: train
    text_field: ${text_field}

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  vocab_size: ${tokenizer.vocab_size}
  token_list: ${tokenizer.save_path}/tokens.txt

  encoder: e_branchformer
  encoder_conf:
    output_size: 256
    attention_heads: 4
    attention_layer_type: rel_selfattn
    pos_enc_layer_type: rel_pos
    rel_pos_type: latest
    cgmlp_linear_units: 1024
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    layer_drop_rate: 0.0
    linear_units: 1024
    positionwise_layer_type: linear
    use_ffn: true
    macaron_ffn: true
    merge_conv_kernel: 31

  decoder: transformer
  decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
    layer_drop_rate: 0.0

  normalize: global_mvn
  normalize_conf:
    stats_file: ${stats_dir}/train/feats_stats.npz

  model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false

    # SentencePiece word boundary (U+2581), not espnet2's "<space>" default.
    # ErrorCalculator rebuilds word boundaries by replacing sym_space before
    # splitting on whitespace; with a BPE vocabulary "<space>" never occurs, so
    # the replacement is a no-op and the training-time valid/wer degenerates
    # into a sentence error rate. This affects the progress metrics only, not
    # the WER/CER from the `measure` stage, which is scored on detokenized text.
    # Written as an escape so it survives review, where U+2581 reads as "_".
    sym_space: "\u2581"

  frontend: default
  frontend_conf:
    n_fft: 512
    win_length: 400
    hop_length: 160

  specaug: specaug
  specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 27]
    num_freq_mask: 2
    apply_time_mask: true
    # Ratio-based, not a fixed frame count: VoxPopuli segment lengths are set by
    # VAD and vary far more than LibriSpeech's, so a fixed mask width would hit
    # short segments much harder than long ones.
    time_mask_width_ratio_range: [0.0, 0.05]
    num_time_mask: 5

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
optimizer:
  _target_: torch.optim.Adam
  lr: 0.002
  weight_decay: 0.000001

scheduler:
  _target_: espnet2.schedulers.warmup_lr.WarmupLR
  warmup_steps: 15000

scheduler_interval: step

##########################################################
#                OTHER TRAINING SETTING                  #
##########################################################
best_model_criterion:
  - - valid/acc
    - 10
    - max

##########################################################
#                   PARALLELIZATION SETTING              #
##########################################################
# Used by collect_stats only; the train stage ignores it. One local worker over
# 182k English segments is slow -- switch `env` to a cluster backend (e.g.
# `slurm`) and add your scheduler's `options` (queue, account, walltime).
parallel:
  env: local
  n_workers: 1

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
# batch_bins counts feats_shape elements (frames x 80 mel) PER GPU. At
# hop_length 160 one second of audio is 100 frames = 8,000 bins, so 3,800,000
# bins is about 475 s of audio per batch, and 1,900 s per optimizer update at
# accumulate_grad_batches 4 -- the same effective batch as
# egs3/librispeech_100.
#
# English is 543 h, so one epoch is roughly 1,954,800 / 475 = 4,115 batches,
# i.e. about 1,029 optimizer updates. Over the 35 epochs configured below that
# is about 36,000 updates, which is what warmup_steps: 15000 is scaled against.
#
# When changing num_device, keep batch_bins * num_device * accumulate_grad_
# batches constant (e.g. 4 GPUs with accumulate_grad_batches: 1), or rescale
# warmup_steps by the same factor.
dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    int_pad_value: -1
  train:
    total_shards: 1
    dist_world_size: ${num_device}
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: true
      # One batch is several hundred separate Ogg reads; a single worker
      # starves the GPU on most filesystems.
      num_workers: 4
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: numel
        batch_size: 16          # ignored by the numel sampler; required arg
        batch_bins: 3800000
        shape_files:
          - ${stats_dir}/train/feats_shape
  valid:
    total_shards: 1
    dist_world_size: ${num_device}
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: false
      num_workers: 4
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: ${dataloader.train.iter_factory.batches.type}
        batch_size: ${dataloader.train.iter_factory.batches.batch_size}
        batch_bins: ${dataloader.train.iter_factory.batches.batch_bins}
        shape_files:
          - ${stats_dir}/valid/feats_shape

##########################################################
#                    TRAINER SETTING                     #
##########################################################
# 35 epochs over 543 h is about 19,000 h of audio seen, comparable to
# egs3/librispeech_100's 200 epochs over 100 h. Raise this substantially for the
# small languages, where one epoch is minutes.
trainer:
  accelerator: auto
  devices: ${num_device}
  num_nodes: ${num_nodes}
  strategy: auto
  accumulate_grad_batches: 4
  check_val_every_n_epoch: 1
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  max_epochs: 35
  precision: bf16-mixed

  logger:
    - _target_: lightning.pytorch.loggers.TensorBoardLogger
      save_dir: ${exp_dir}/tensorboard
      name: tb_logger
